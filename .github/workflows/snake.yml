name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Shlokverma0
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=blue,#3B82F6,#1D4ED8&color_dots=#161B22,#161B22,#161B22,#161B22,#161B22
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=blue,#3B82F6,#1D4ED8&color_dots=#0d1117,#0d1117,#0d1117,#0d1117,#0d1117

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
